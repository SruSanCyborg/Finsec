<style>
  /* Sirius's own tokens (docs/system-overview.md, ui/theme.ts).
     Single-theme on purpose: the PRD specifies dark-first, terminal-inspired,
     and the page's material is literal terminal output. Everything is painted
     explicitly so it holds on any host ground. */
  :root {
    --ink: #07080a;
    --panel: #101111;
    --raised: #16181d;
    --rule: #23262d;
    --rule-soft: #1a1c21;
    --text: #f2f3f5;
    --muted: #8a8f98;
    --dim: #6b7078;
    --violet: #7c3aed;
    --violet-lit: #a678f5;
    --gain: #04b575;
    --hold: #ff9f43;
    --loss: #ff5c5c;
    --cool: #5ac8fa;

    --sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --cond: "IBM Plex Sans Condensed", "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

    --col: 1060px;
    --gutter: 148px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.62;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }

  .wrap {
    max-width: var(--col);
    margin: 0 auto;
    padding: 0 28px 96px;
  }

  /* ---- shared type ---- */
  .eyebrow {
    font-family: var(--cond);
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--dim);
    margin: 0;
  }

  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .gain { color: var(--gain); }
  .hold { color: var(--hold); }
  .loss { color: var(--loss); }
  .cool { color: var(--cool); }
  .muted { color: var(--muted); }
  .dim { color: var(--dim); }

  /* ---- masthead ---- */
  .mast { padding: 72px 0 0; }

  .brandline {
    display: flex;
    align-items: baseline;
    gap: 14px;
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--dim);
    letter-spacing: 0.04em;
  }
  .brandline b { color: var(--violet-lit); font-weight: 500; }
  .brandline .sep { color: var(--rule); }

  h1 {
    font-family: var(--sans);
    font-weight: 600;
    font-size: clamp(38px, 6vw, 62px);
    line-height: 1.04;
    letter-spacing: -0.025em;
    text-wrap: balance;
    margin: 26px 0 0;
  }
  h1 em {
    font-style: normal;
    color: var(--muted);
  }

  .thesis {
    max-width: 62ch;
    margin: 24px 0 0;
    font-size: 18.5px;
    line-height: 1.62;
    color: var(--muted);
  }
  .thesis strong { color: var(--text); font-weight: 500; }

  /* ---- stat strip ---- */
  .strip {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--rule);
    border: 1px solid var(--rule);
    margin: 52px 0 0;
  }
  .stat { background: var(--panel); padding: 20px 20px 18px; }
  .stat .k {
    font-family: var(--cond);
    font-weight: 600;
    font-size: 11.5px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .stat .v {
    font-family: var(--mono);
    font-weight: 500;
    font-size: 30px;
    line-height: 1.18;
    margin-top: 8px;
    letter-spacing: -0.02em;
  }
  .stat .n { font-size: 13px; color: var(--muted); margin-top: 5px; line-height: 1.45; }

  /* ---- sections ---- */
  section { margin-top: 92px; }

  .head {
    display: grid;
    grid-template-columns: var(--gutter) 1fr;
    gap: 28px;
    align-items: start;
    border-top: 1px solid var(--rule);
    padding-top: 22px;
    position: relative;
  }
  .head::before {
    content: "";
    position: absolute;
    top: -1px; left: 0;
    width: 46px; height: 2px;
    background: var(--violet);
  }
  .head h2 {
    font-size: 27px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0;
    text-wrap: balance;
  }
  .head p {
    margin: 12px 0 0;
    color: var(--muted);
    max-width: 64ch;
    font-size: 16.5px;
  }
  .head .label { padding-top: 5px; }

  .body { margin-left: calc(var(--gutter) + 28px); }
  @media (max-width: 860px) {
    .head { grid-template-columns: 1fr; gap: 10px; }
    .body { margin-left: 0; }
    .strip { grid-template-columns: repeat(2, 1fr); }
  }

  /* ---- panels ---- */
  .panel {
    border: 1px solid var(--rule);
    background: var(--panel);
    margin-top: 26px;
  }
  .panel > .cap {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--rule);
    background: var(--raised);
  }
  .cap .t {
    font-family: var(--cond);
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .cap .s { font-family: var(--mono); font-size: 12px; color: var(--dim); }
  .scroll { overflow-x: auto; }

  /* ---- policy table ---- */
  table.policies { border-collapse: collapse; width: 100%; min-width: 660px; }
  table.policies th {
    font-family: var(--cond);
    font-weight: 600;
    font-size: 11.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dim);
    text-align: left;
    padding: 12px 18px 10px;
    border-bottom: 1px solid var(--rule);
    white-space: nowrap;
  }
  table.policies th.r, table.policies td.r { text-align: right; }
  table.policies td {
    padding: 13px 18px;
    border-bottom: 1px solid var(--rule-soft);
    font-size: 14.5px;
    vertical-align: middle;
  }
  table.policies tr:last-child td { border-bottom: 0; }
  table.policies td.name { font-weight: 500; white-space: nowrap; }
  table.policies td.money { font-family: var(--mono); font-size: 15px; white-space: nowrap; }
  table.policies td.note { color: var(--dim); font-size: 13.5px; }
  tr.self { background: rgba(124, 58, 237, 0.09); }
  tr.self td { border-bottom-color: var(--rule); }
  tr.self td.name { color: var(--violet-lit); }
  tr.ceiling td { color: var(--muted); }

  .mark {
    display: inline-block;
    width: 1.1em;
    font-family: var(--mono);
    color: var(--violet-lit);
  }

  /* ---- the dot row: records nothing may touch ---- */
  .dots { display: flex; gap: 3px; flex-wrap: wrap; max-width: 180px; }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--rule);
    box-shadow: inset 0 0 0 1px #2c3038;
  }
  .dot.hit { background: var(--loss); box-shadow: 0 0 6px rgba(255, 92, 92, 0.55); }
  .dot.clean { background: transparent; box-shadow: inset 0 0 0 1px #2c3038; }

  .legend {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    padding: 13px 18px;
    border-top: 1px solid var(--rule);
    font-size: 13px;
    color: var(--dim);
    background: var(--raised);
  }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }

  /* ---- capacity sweep ---- */
  .sweep { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; background: var(--rule); }
  .sweep .c { background: var(--panel); padding: 18px 16px 16px; }
  .sweep .cap-k { font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .sweep .edge { font-family: var(--mono); font-size: 24px; margin-top: 10px; color: var(--gain); letter-spacing: -0.02em; }
  .bar { height: 4px; background: var(--rule); margin-top: 12px; position: relative; overflow: hidden; }
  .bar i { position: absolute; inset: 0 auto 0 0; background: var(--cool); display: block; }
  .sweep .n { font-size: 12.5px; color: var(--dim); margin-top: 8px; line-height: 1.4; }

  /* ---- waterfall ---- */
  .fall { padding: 6px 0; }
  .fall .row {
    display: grid;
    grid-template-columns: 190px 130px 1fr;
    gap: 16px;
    align-items: center;
    padding: 11px 18px;
    border-bottom: 1px solid var(--rule-soft);
  }
  .fall .row:last-child { border-bottom: 0; }
  .fall .row.total { background: var(--raised); border-top: 1px solid var(--rule); }
  .fall .k { font-size: 14.5px; }
  .fall .v { font-family: var(--mono); font-size: 16px; text-align: right; white-space: nowrap; }
  .fall .row.total .v { font-size: 19px; }
  .fall .track { height: 9px; background: #14161a; position: relative; }
  .fall .track i { position: absolute; top: 0; bottom: 0; display: block; }
  .fall .n { grid-column: 1 / -1; font-size: 13px; color: var(--dim); margin-top: -3px; }

  /* ---- rules grid ---- */
  .rules { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--rule); }
  @media (max-width: 720px) { .rules { grid-template-columns: 1fr; } .fall .row { grid-template-columns: 1fr 110px; } .fall .track { display: none; } }
  .rules .r { background: var(--panel); padding: 15px 18px; }
  .rules .r:hover { background: var(--raised); }
  .rules .id { font-family: var(--mono); font-size: 13.5px; color: var(--text); }
  .rules .ct { float: right; font-family: var(--mono); font-size: 13px; color: var(--hold); }
  .rules .ct.zero { color: var(--dim); }
  .rules .says { font-size: 13.5px; color: var(--muted); margin-top: 5px; }
  .rules .basis { font-size: 12.5px; color: var(--dim); margin-top: 6px; font-style: italic; }

  /* ---- terminal / trail ---- */
  pre.term {
    margin: 0;
    padding: 18px;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.65;
    color: var(--text);
    overflow-x: auto;
    white-space: pre;
    tab-size: 2;
  }
  pre.term .c { color: var(--dim); }
  pre.term .v { color: var(--violet-lit); }
  pre.term .g { color: var(--gain); }
  pre.term .a { color: var(--hold); }
  pre.term .r { color: var(--loss); }
  pre.term .b { color: var(--cool); }
  pre.term .w { color: var(--text); font-weight: 500; }

  .chain { display: grid; gap: 0; }
  .chain .link { padding: 15px 18px; border-bottom: 1px solid var(--rule-soft); }
  .chain .link:last-child { border-bottom: 0; }
  .chain .h { font-family: var(--mono); font-size: 12px; color: var(--dim); word-break: break-all; }
  .chain .h b { color: var(--cool); font-weight: 400; }

  /* ---- exceptions ---- */
  .exc { display: grid; gap: 1px; background: var(--rule); }
  .exc .e { background: var(--panel); padding: 15px 18px; display: grid; grid-template-columns: 190px 120px 1fr; gap: 16px; align-items: baseline; }
  @media (max-width: 720px) { .exc .e { grid-template-columns: 1fr; gap: 4px; } }
  .exc .kind { font-family: var(--mono); font-size: 13.5px; color: var(--hold); }
  .exc .amt { font-family: var(--mono); font-size: 14px; text-align: right; }
  .exc .step { font-size: 13.5px; color: var(--muted); }

  /* ---- tiers ---- */
  .tiers { display: grid; grid-template-columns: 120px 1fr 60px; gap: 14px 16px; padding: 18px; align-items: center; }
  .tiers .tn { font-family: var(--mono); font-size: 13.5px; }
  .tiers .tv { font-family: var(--mono); font-size: 13.5px; text-align: right; color: var(--muted); }
  .tiers .tbar { height: 8px; background: #14161a; position: relative; }
  .tiers .tbar i { position: absolute; inset: 0 auto 0 0; display: block; background: var(--cool); }
  .tiers .tbar.probable i { background: var(--hold); }
  .tiers .note { grid-column: 1 / -1; font-size: 13px; color: var(--dim); margin-top: 2px; }

  /* ---- callout ---- */
  .callout {
    border-left: 2px solid var(--violet);
    padding: 4px 0 4px 22px;
    margin: 30px 0 0;
    max-width: 66ch;
  }
  .callout p { margin: 0; color: var(--muted); font-size: 16.5px; }
  .callout p + p { margin-top: 12px; }
  .callout strong { color: var(--text); font-weight: 500; }

  /* ---- found-in-itself list ---- */
  ol.found { list-style: none; counter-reset: f; margin: 26px 0 0; padding: 0; }
  ol.found li {
    counter-increment: f;
    display: grid;
    grid-template-columns: 34px 1fr;
    gap: 16px;
    padding: 15px 0;
    border-bottom: 1px solid var(--rule-soft);
    color: var(--muted);
    font-size: 15.5px;
  }
  ol.found li::before {
    content: counter(f, decimal-leading-zero);
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--violet-lit);
    padding-top: 4px;
  }
  ol.found li b { color: var(--text); font-weight: 500; }

  /* ---- run block ---- */
  .run {
    border: 1px solid var(--rule);
    background: var(--panel);
    padding: 20px 22px;
    margin-top: 26px;
    font-family: var(--mono);
    font-size: 13.5px;
    line-height: 1.9;
    overflow-x: auto;
  }
  .run .p { color: var(--violet-lit); }
  .run .c { color: var(--dim); }

  footer {
    margin-top: 84px;
    border-top: 1px solid var(--rule);
    padding-top: 22px;
    color: var(--dim);
    font-size: 13.5px;
    display: flex;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }
  footer .mono { font-family: var(--mono); }

  a { color: var(--violet-lit); text-decoration: none; border-bottom: 1px solid rgba(166, 120, 245, 0.35); }
  a:hover { border-bottom-color: var(--violet-lit); }
  a:focus-visible { outline: 2px solid var(--violet-lit); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
