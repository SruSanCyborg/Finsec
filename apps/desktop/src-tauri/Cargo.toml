[package]
name = "sirius-desktop"
version = "0.1.0"
description = "SIRIUS — desktop command center for the sirius engine"
edition = "2021"

# See https://v2.tauri.app/reference/config/#lib
[lib]
name = "sirius_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# A demo binary that starts fast matters more than a few extra megabytes.
panic = "abort"
codegen-units = 1
lto = true
